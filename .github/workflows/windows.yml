name: Windows distribution
on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -m "not browser"
      - run: python scripts/build_windows.py --output dist/windows
      - run: python scripts/smoke_windows.py --setup dist/windows/Systematic-Setup.exe --work .windows-smoke/release
      - uses: actions/upload-artifact@v4
        with:
          name: Systematic-Windows
          path: dist/windows/
          if-no-files-found: error
